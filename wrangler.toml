# ─────────────────────────────────────────────────────────────
# Cloudflare Pages configuration for Scholarics
# Static site is served from the repo root; the `functions/` directory
# provides the edge API (Gemini AI + email + bug report).
# ─────────────────────────────────────────────────────────────

name = "scholaricsv-2"
compatibility_date = "2024-11-01"
pages_build_output_dir = "."

# Non-secret environment variables

EMAIL_FROM = "Scholarics <onboarding@resend.dev>"
EMAIL_TO = "yourgmail@gmail.com"

# KV Namespaces

[[kv_namespaces]]
binding = "SUBMISSIONS"
id = "d5c9109022514e09a593dde64815e7ca"

[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "6a0ac34d4e9f4293b347d1bc064a08ee"
