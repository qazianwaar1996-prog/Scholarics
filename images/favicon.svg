<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="14" fill="#0f0d06"/>
  <!-- Cap board top -->
  <path d="M12 24l20-10 20 10-20 10z" fill="#f8fafc"/>
  <!-- Cap brim shadow line -->
  <path d="M12 24l20 10 20-10" stroke="#d0cfc8" stroke-width="0.6" fill="none"/>
  <!-- Left leg of cap stand -->
  <path d="M32 34v10" stroke="#f8fafc" stroke-width="2.8" stroke-linecap="round"/>
  <!-- Right leg toggle cord -->
  <path d="M46 24v8" stroke="#f5c542" stroke-width="2.4" stroke-linecap="round"/>
  <!-- Tassel ball -->
  <circle cx="46" cy="34" r="3" fill="#f5c542"/>
  <!-- Bar chart under cap - data element -->
  <rect x="19" y="46" width="5" height="9" rx="1.5" fill="#f5c542"/>
  <rect x="27" y="41" width="5" height="14" rx="1.5" fill="#f5c542" opacity="0.85"/>
  <rect x="35" y="43" width="5" height="12" rx="1.5" fill="#f5c542" opacity="0.7"/>
  <!-- Trend line over bars -->
  <path d="M21.5 45 L29.5 40 L37.5 42" stroke="#f8fafc" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <circle cx="21.5" cy="45" r="1.5" fill="#f8fafc"/>
  <circle cx="29.5" cy="40" r="1.5" fill="#f8fafc"/>
  <circle cx="37.5" cy="42" r="1.5" fill="#f8fafc"/>
</svg>
